services:
  - type: web
    name: retirement-and-expenses-system
    env: python
    pythonVersion: "3.12.10"
    plan: free
    rootDir: matoleo_system
    buildCommand: python -m pip install -r ../requirements.txt
    releaseCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && (python manage.py ensure_admin || true)
    startCommand: gunicorn matoleo_system.wsgi:application --workers 3 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: matumiz_db
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: "MKJ"
      - key: ADMIN_PASSWORD
        value: "Hot@2000"
      - key: ADMIN_EMAIL
        value: "hotmass81@gmail.com"

databases:
  - name: matumiz_db
    type: postgresql
    plan: free
    databaseName: matumiz_db
    user: matumiz_db_user
